[package]
name = "aeroflow-wasm-api"
description = "wasm-bindgen boundary for the AeroFlow solver"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aeroflow-geometry = { workspace = true }
aeroflow-flow-core = { workspace = true }
aeroflow-panel-method = { workspace = true }
aeroflow-solver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

# The distro `wasm-opt` predates reference types and corrupts wasm-bindgen's
# externref table ("WebAssembly.Table.grow(): failed to grow table"). The
# Rust release profile already applies LTO and opt-level 3, so skip it.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
